[pytest]
# Run the whole test suite from the repository root:
#   python -m pytest
# The analysis tests import the `analysis` package (from data_analysis/)
# and the `tests` package itself (from data_analysis/analysis/, via
# test_stats.py's `from tests.conftest import ...`); the extraction tests
# import the `data_extract` package (from data_analysis/data_extract/src/).
testpaths = data_analysis/analysis/tests data_analysis/data_extract/tests
pythonpath = data_analysis data_analysis/analysis data_analysis/data_extract/src
addopts = -q -p no:warnings
