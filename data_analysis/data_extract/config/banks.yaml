# Five bank series. `series` is the folder/file code used in data/reports/.
# Pre-merger rows name the acquiring institution; post-merger rows name the
# consolidated institution. FY 2079/80 is the transition year for the four
# merged series and is flagged, never described as clean pre/post.
series:
  - code: GBIME
    current_name: Global IME Bank Limited
    pre_merger_name: Global IME Bank Limited
    post_merger_name: Global IME Bank Limited
    absorbed: Bank of Kathmandu
    joint_operation: "2023-01-09"
    swap_ratio: "1:1"
    merged: true
  - code: HBL
